apiVersion: apps/v1
kind: Deployment
metadata: {name: northstar-analytics-consumer, namespace: northstar}
spec:
  replicas: 1
  selector: {matchLabels: {app: northstar-analytics-consumer}}
  template:
    metadata: {labels: {app: northstar-analytics-consumer, app.kubernetes.io/part-of: northstar}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: analytics-consumer
          image: northstar/api:replace-with-immutable-tag
          command: [python, -m, northstar_api.workers.analytics_consumer]
          envFrom: [{configMapRef: {name: northstar-config}}, {secretRef: {name: northstar-secrets}}]
          env: [{name: DATABASE_URL, valueFrom: {secretKeyRef: {name: northstar-secrets, key: WORKER_DATABASE_URL}}}]
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 256Mi}}]
