apiVersion: apps/v1
kind: Deployment
metadata: {name: northstar-api, namespace: northstar}
spec:
  replicas: 2
  selector: {matchLabels: {app: northstar-api}}
  template:
    metadata: {labels: {app: northstar-api, app.kubernetes.io/part-of: northstar}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {app: northstar-api}}}
      containers:
        - name: api
          image: northstar/api:replace-with-immutable-tag
          command: [uvicorn, northstar_api.main:app, --host, 0.0.0.0, --port, "8000", --no-proxy-headers]
          envFrom: [{configMapRef: {name: northstar-config}}, {secretRef: {name: northstar-secrets}}]
          ports: [{name: http, containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 20}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 256Mi}}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: northstar}
spec:
  selector: {app: northstar-api}
  ports: [{name: http, port: 8000, targetPort: http}]
