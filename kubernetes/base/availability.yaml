spec:
  minAvailable: 1
  selector: {matchLabels: {app: northstar-web}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: northstar-worker, namespace: northstar}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: northstar-worker}}
