limit_req_zone $binary_remote_addr zone=northstar_login_per_ip:10m rate=10r/m;

server {
  listen 8080;
  client_max_body_size 501m;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=()" always;
  # __WEB_CSP_EXTRA_CONNECT_SRC__ is replaced with a validated, origin-only
  # build argument. Rebuild the image whenever the public object-store origin
  # changes so direct presigned uploads remain allowed.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.facebook.com https://*.fbcdn.net; font-src 'self' data:; connect-src 'self' https://www.facebook.com https://web.facebook.com https://graph.facebook.com __WEB_CSP_EXTRA_CONNECT_SRC__; frame-src https://www.facebook.com https://web.facebook.com; frame-ancestors 'self'; form-action 'self'" always;
  limit_req_status 429;

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
  location = /api/v1/auth/login {
    limit_req zone=northstar_login_per_ip burst=5 nodelay;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 180s;
  }
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 180s;
  }

  location /storage/ {
    rewrite ^/storage/(.*)$ /$1 break;
    proxy_pass http://minio:9000;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  # The public widget must be frameable by customer sites. Runtime bootstrap and
  # session creation still enforce each agent's configured origin allowlist.
  location ^~ /widget/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors *" always;
    # Serve the SPA shell in this location so an internal redirect cannot
    # re-apply the admin route's SAMEORIGIN header.
    try_files /index.html =404;
  }

  location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    # add_header directives at this level suppress inherited server headers.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.facebook.com https://*.fbcdn.net; font-src 'self' data:; connect-src 'self' https://www.facebook.com https://web.facebook.com https://graph.facebook.com __WEB_CSP_EXTRA_CONNECT_SRC__; frame-src https://www.facebook.com https://web.facebook.com; frame-ancestors 'self'; form-action 'self'" always;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / { try_files $uri $uri/ /index.html; }
}
